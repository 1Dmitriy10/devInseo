<section class='main-form bg_white border_bg pb_160 mob-p_0'>
    <div class='container main-form__container'>
        <div class="main-form__wrap">
            <div class="main-form__text-box">
                <div class="main-form__title">
                    Поможем вашему бизнесу<br>в продвижениии
                </div>

                <div class="main-form__subtitle">
                    Больше трафика, больше клиентов, больше прибыли. Оставьте заявку — обсудим стратегию для вас.
                </div>

                <form class="primary-form" action="">
                    <div class="form__row">
                        <input type="text" name="name" placeholder="Ваше имя">
                    </div>

                    <div class="form__row">
                        <input type="text" name="tel" placeholder="___ ___ __ __">
                    </div>

                    <button class="btn primary-form__btn" type="submit">Отправить</button>

                    <div class="agree-box">

                        <span>Заполняя эту форму, Вы соглашаетесь с правилами
                            <a href="#">Политики Конфиденциальности</a>
                        </span>
                    </div>
                </form>
            </div>

            <div class="main-form__img-box">
                <picture>
                    <!-- avif -->
                    <source srcset='@img/form/main-form-img.avif' type='image/avif' />
                    <!-- webp -->
                    <source srcset='@img/form/main-form-img.webp' type='image/webp' />
                    <!-- jpeg -->
                    <source srcset='@img/form/main-form-img-sm.jpeg' media='(max-width: 768px)' type='image/jpeg' />
                    <!-- png -->
                    <source srcset='@img/form/main-form-img-sm.png' media='(max-width: 768px)' type='image/jpeg' />
                    <!-- original -->
                    <img src='@img/form/main-form-img.png' class='img-responsive' alt='' loading='lazy' />
                </picture>
            </div>
        </div>

    </div>
</section>
